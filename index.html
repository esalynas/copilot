<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de API Gemini</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #111; color: #fff; }
    input { padding: 8px; width: 300px; }
    button { padding: 8px 16px; cursor: pointer; }
    #result { margin-top: 1rem; padding: 1rem; background: #222; border-radius: 6px; }
  </style>
</head>
<body>

  <h2>🧪 Prueba de conexión a la API de Gemini</h2>
  
  <p>Ingresa tu API Key de Google AI Studio:</p>
  <input type="password" id="apiKey" placeholder="Pega tu API Key aquí">
  <button onclick="probarAPI()">Probar API</button>

  <div id="result">El resultado de la API aparecerá aquí...</div>

  <script>
    async function probarAPI() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const resultDiv = document.getElementById('result');

      if (!apiKey) {
        alert("Por favor ingresa una API Key.");
        return;
      }

      resultDiv.innerText = "⏳ Conectando con Gemini...";

      // Usamos el endpoint v1 oficial
      const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      const payload = {
        contents: [{
          parts: [{ text: "Responde solo con esta frase: ¡La API de Gemini está funcionando correctamente!" }]
        }]
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.error) {
          resultDiv.innerHTML = `<span style="color: #f87171;">❌ Error de API (${data.error.code}): ${data.error.message}</span>`;
        } else {
          const textoRespuesta = data.candidates[0].content.parts[0].text;
          resultDiv.innerHTML = `<span style="color: #4ade80;">✅ Respuesta recibida:</span><br><br><b>${textoRespuesta}</b>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<span style="color: #f87171;">❌ Error de red: ${err.message}</span>`;
      }
    }
  </script>

</body>
</html>
